services:
  postgres:
    image: postgres:17-alpine
    init: true
    environment:
      POSTGRES_DB: crewos
      POSTGRES_USER: crewos
      POSTGRES_PASSWORD: crewos_dev_only
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - crewos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
  app:
    build: .
    init: true
    ports:
      - "4173:4173"
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 4173
      PROCESS_ROLE: ${PROCESS_ROLE:-combined}
      DATABASE_URL: ${DATABASE_URL:-postgresql://crewos:crewos_dev_only@postgres:5432/crewos}
      # The app runs in a container; its 127.0.0.1 is not the Mac host.
      DEV_LLM_BASE_URL: ${DEV_LLM_CONTAINER_BASE_URL:-http://host.docker.internal:8317/v1}
      DATABASE_FILE: /data/crewos.sqlite
      PYTHON: /opt/venv/bin/python
    volumes:
      - crewos_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4173/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    stop_grace_period: 40s

volumes:
  crewos_data:
  crewos_postgres_data:
